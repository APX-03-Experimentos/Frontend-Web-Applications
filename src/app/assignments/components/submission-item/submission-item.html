<mat-card class="submission-card">
  <div class="card-header">
    <div class="header-left">
      <mat-icon class="avatar-icon">person</mat-icon>
      <div class="student-info">
        <h3 class="student-name">Estudiante: {{ owner?.userName }}</h3>
      </div>
    </div>

    <div class="header-right">
      <div class="grade-info">
        <h4 class="grade-label">Calificación: </h4>
        <p class="grade-value">
          @if (submission?.status === "NOT_GRADED") {
            Ninguna
          } @else if (submission?.status === "GRADED") {
            {{ submission?.score }}
          }
        </p>
      </div>
    </div>
  </div>

  <div class="card-actions">
    <button mat-raised-button class="btn-primary" (click)="OpenContent()">
      <mat-icon>visibility</mat-icon>
      Ver
    </button>
  </div>
</mat-card>
