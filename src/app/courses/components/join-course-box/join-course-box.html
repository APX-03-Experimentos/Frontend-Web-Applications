<div class="join-code-section">
  <div class="join-group-container">
    <h2 style="margin: 0;">Unirse a un Curso: </h2>
    <mat-form-field>
      <mat-label>Código de Unión</mat-label>
      <input matInput [(ngModel)]="key" placeholder="Código">
    </mat-form-field>
    <button mat-flat-button (click)="Join()">Unirse</button>
  </div>
</div>
