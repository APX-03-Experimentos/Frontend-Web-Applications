<mat-card class="course-card" appearance="outlined">
  <img mat-card-image src="{{course?.imageUrl}}" alt="{{course?.title}}">
  <mat-card-content>
    <h2>{{course?.title}}</h2>
    <h3>Key: {{course?.key}}</h3>
    <button mat-button color="secondary">Ver</button>
  </mat-card-content>
</mat-card>
